<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Automata</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>Automata</h1>
    <div class="toolbar">
      <button id="btn-record" title="Record your actions in the browser pane into steps">● Record</button>
      <button id="btn-stop" disabled title="Stop recording and save the captured steps">■ Stop</button>
      <button id="btn-run" disabled title="Run the selected task for real">▶ Run</button>
      <button id="btn-dryrun" disabled title="Execute but stop before the first commit-point step">Dry Run</button>
      <button id="btn-validate" disabled title="Resolve + highlight every element, change nothing">Validate</button>
      <button id="btn-continue" disabled title="Resume a run paused by a wait-for-user step">➤ Continue</button>
      <button id="btn-cancel-run" disabled title="Cancel the current run">✕</button>
      <button id="btn-import" title="Import a collection or task from a zip">⇪ Import</button>
      <button id="btn-export" disabled title="Export the selected collection or task as a zip">⇩ Export</button>
      <button id="btn-folder" title="Open the Collections folder in File Explorer">📁</button>
    </div>
    <div class="row">
      <input id="url" type="text" placeholder="https://www.google.com" />
      <button id="go">Go</button>
    </div>
  </header>

  <section id="rec-preview" class="hidden">
    <label>Recording — live preview</label>
    <div id="rec-steps"></div>
  </section>

  <nav id="tree-section">
    <div class="section-head">
      <label>Collections</label>
      <button id="btn-new-collection" class="mini">+ collection</button>
    </div>
    <div id="tree"></div>
    <div id="trash">🗑 drag a task or step here to delete it</div>
  </nav>

  <section id="editor" class="hidden"></section>

  <details id="advanced">
    <summary>AI task (advanced — free-text, interpreted by an LLM)</summary>
    <label class="inline"><input type="checkbox" id="allow-repair" /> allow LLM repair when a replayed step can't resolve (Run mode only)</label>
    <textarea id="task" rows="3" placeholder="e.g. search for 'cats' and report the first 5 result titles"></textarea>
    <div class="row">
      <button id="run">Run AI task</button>
      <button id="cancel" disabled>Cancel</button>
    </div>
  </details>

  <section class="log-section">
    <label>Log</label>
    <div id="log"></div>
  </section>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <label id="modal-title">Rename</label>
      <p id="modal-msg" class="hidden"></p>
      <input type="text" id="modal-input" />
      <div class="row">
        <button id="modal-ok">Rename</button>
        <button id="modal-cancel" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

<script src="panel.js"></script>
</body>
</html>
